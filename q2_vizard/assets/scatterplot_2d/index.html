<!DOCTYPE html>
<html>
<head>
  <!-- Import Vega & Vega-Lite (does not have to be from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
  <!-- Import vega-embed -->
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
  <script type="application/json" id="spec">
    {{ spec }}
  </script>
  <style>
    body {
      width: 100%;
      box-sizing: border-box;
      margin: 0px;
      padding: 10px;
    }
    #viz {
      margin: 100px auto;
      position: relative;
    }
    .vega-bindings {
      top: 25px;
      left: 25px;
      display: flex;
      position: fixed;
      font-family: monospace;
    }
    .vega-bind {
      margin-right: 50px;
      vertical-align: middle;
    }
    .vega-bind span {
      display: flex;
    }
  </style>
</head>
<body>

<div id="viz"></div>

<script type="text/javascript">
  var spec = JSON.parse(document.getElementById('spec').innerHTML);

  // Calculate initial width and height
  spec.width = window.innerWidth * 0.7;
  spec.height = window.innerHeight * 0.7;
  
  // Embed the Vega spec
  vegaEmbed('#viz', spec, {'renderer': 'svg'}).then(function(result) {
    // Store the Vega view instance for later resizing
    var view = result.view;
    var svg = document.querySelector('#viz svg');

    // Add id & xy attrs to the marks for easy selection in Selenium
    var marks = svg.querySelectorAll('g.marks > path');
    marks.forEach(function(mark, index) {
      var data = view.data('table')[index];

    // Function to resize the view without reloading the spec
    function resizeVega() {
      view.width(window.innerWidth * 0.7).height(window.innerHeight * 0.7).run();
    }
    
    // Resize on window resize
    window.addEventListener('resize', resizeVega);
    
    // These are each connected to a vega signal to pull the correct field
    var id = data[view.signal('idField')];
    var x = data[view.signal('xField')];
    var y = data[view.signal('yField')];

    // Add attrs to the marks elements for id & xy positions
    mark.setAttribute('data-id', id);
    mark.setAttribute('data-x', x);
    mark.setAttribute('data-y', y);
   });
  }).catch(console.error);

</script>
</body>
</html>
