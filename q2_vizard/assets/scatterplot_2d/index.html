<!DOCTYPE html>
<html>
<head>
  <!-- Import Vega & Vega-Lite (does not have to be from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
  <!-- Import vega-embed -->
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
  <script type="application/json" id="spec">
    {{ spec }}
  </script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #viz {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      position: relative;
    }
    .vega-bindings {
      top: 25px;
      left: 25px;
      display: flex;
      position: fixed;
      font-family: monospace;
    }
    .vega-bind {
      margin-right: 50px;
      vertical-align: middle;
    }
    .vega-bind span {
      display: flex;
    }
  </style>
</head>
<body>

<div id="viz"></div>

<script type="text/javascript">
  var spec = JSON.parse(document.getElementById('spec').innerHTML);

  vegaEmbed('#viz', spec, {'renderer': 'svg'}).then(function(result) {
    var view = result.view;
    var svg = document.querySelector('#viz svg');

    // Add id & xy attrs to the marks for easy selection in Selenium
    var marks = svg.querySelectorAll('g.marks > path');
    marks.forEach(function(mark, index) {
      var data = view.data('table')[index];

      // These are each connected to a vega signal to pull the correct field
      var id = data[view.signal('idField')];
      var x = data[view.signal('xField')];
      var y = data[view.signal('yField')];

      // Add attrs to the marks elements for id & xy positions
      mark.setAttribute('data-id', id);
      mark.setAttribute('data-x', x);
      mark.setAttribute('data-y', y);
    });

    // Only one of the two color palette dropdowns applies at a time -
    // discrete for a categorical colorBy, continuous for a numeric one
    var paletteBindings = {};
    var bindings = document.querySelectorAll('#viz .vega-bind');
    bindings.forEach(function(binding) {
      var bindName = binding.querySelector('.vega-bind-name');
      if (bindName && (bindName.textContent === 'discretePalette' ||
                       bindName.textContent === 'continuousPalette')) {
        paletteBindings[bindName.textContent] = binding;
      }
    });

    function togglePaletteBindings(colorIsNumeric) {
      Object.keys(paletteBindings).forEach(function(bindName) {
        var applies = (bindName === 'continuousPalette') === !!colorIsNumeric;
        paletteBindings[bindName].style.display = applies ? '' : 'none';
      });
    }

    togglePaletteBindings(view.signal('colorIsNumeric'));
    view.addSignalListener('colorIsNumeric', function(_, value) {
      togglePaletteBindings(value);
    });

  }).catch(console.error);
</script>
</body>
</html>
