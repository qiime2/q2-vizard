package:
  name: q2-vizard
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - pip
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - pandas {{ pandas }}
  - jinja2
  - qiime2 {{ qiime2_epoch }}.*
  - q2-types {{ qiime2_epoch }}.*
  build:
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - pytest
  - selenium
  imports:
  - q2_vizard
  - qiime2.plugins.vizard
  commands:
  - py.test --pyargs q2_vizard
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
