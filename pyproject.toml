[project]
name = 'q2-vizard'
authors = [
    {name = 'Liz Gehret', email = 'elizabeth.gehret@nau.edu'}
]
description = 'QIIME 2 Plugin used for generalized microbiome visualizations.'
readme = 'README.md'
license = {file = 'LICENSE'}
dynamic = ['version']

[project.urls]
Homepage = 'https://qiime2.org'
Documentation = 'https://docs.qiime2.org'
Repository = 'https://github.com/qiime2/q2-vizard'

[project.entry-points.'qiime2.plugins']
q2-vizard = 'q2_vizard.plugin_setup:plugin'

[build-system]
requires = [
    'setuptools',
    'toml',
    'versioningit',
    'wheel'
]
build-backend = 'setuptools.build_meta'

[tool.versioningit.vcs]
method = 'git'
default-tag = '0.0.1'

[tool.versioningit.next-version]
method = 'minor'

[tool.versioningit.format]
distance = '{base_version}+{distance}.{vcs}{rev}'
dirty = '{base_version}+{distance}.{vcs}{rev}.dirty'
distance-dirty = '{base_version}+{distance}.{vcs}{rev}.dirty'

[tool.setuptools.package-data]
'*' = ['*.tsv', '*.json', '*.html']
